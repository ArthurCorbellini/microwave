kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30081
        hostPort: 8081
      - containerPort: 30082
        hostPort: 8082
      - containerPort: 30083
        hostPort: 8083
      - containerPort: 30084
        hostPort: 8084
      - containerPort: 30085
        hostPort: 8085
      - containerPort: 30672
        hostPort: 15672
