apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-db
  namespace: microwave
  labels:
    app: catalog-db
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce PVC can't be mounted by two Pods at once, which a
    # default RollingUpdate would briefly attempt.
    type: Recreate
  selector:
    matchLabels:
      app: catalog-db
  template:
    metadata:
      labels:
        app: catalog-db
    spec:
      containers:
        - name: catalog-db
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: catalog-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catalog", "-d", "catalog_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalog-db-data
