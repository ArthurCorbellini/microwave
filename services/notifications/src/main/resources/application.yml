server:
  port: 8085

spring:
  application:
    name: notifications
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db
    username: notifications
    password: notifications
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notifications-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.microwave.notifications.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.microwave.notifications.notification.messaging.OrderCreatedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health
